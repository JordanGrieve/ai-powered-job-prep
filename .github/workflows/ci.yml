name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `next build` validates the environment at module load before it reaches
      # any application code - app/data/env/{server,client}.ts require 15
      # non-empty variables with emptyStringAsUndefined. .env.example carries
      # placeholders for all of them, including a structurally valid Clerk
      # publishable key (Clerk rejects a bare pk_test_xxxx during prerender), so
      # CI can build without any real credentials.
      - name: Build
        run: |
          cp .env.example .env
          npm run build

  # Migrations run against the real database on release, never in the PR job.
  # Wire this to your deploy: it must complete BEFORE the new build serves
  # traffic. Requires a DATABASE_URL secret; the job is skipped until one is set.
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply Drizzle migrations
        env:
          # One secret, not five. A hosted provider (Neon, Supabase, Vercel
          # Postgres) hands you a single connection string, and the env schema
          # now accepts it directly - decomposing it into DB_* parts would
          # silently drop the sslmode and channel_binding parameters those
          # providers require.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # drizzle.config.ts imports the whole server env schema, so the
        # non-database variables must still be present. .env.example supplies
        # placeholders for those; dotenv does not overwrite variables already
        # set in the environment, so the real DATABASE_URL above wins.
        #
        # The guard matters: without it, an unconfigured repo falls back to the
        # .env.example placeholders, dials localhost:5432 on the runner, and
        # fails - putting a red X on main that means nothing. The `secrets`
        # context is not available in a job-level `if`, so the check lives here.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Migrations skipped::No DATABASE_URL secret is configured on this repository, so there is no database to migrate. Add it under Settings -> Secrets and variables -> Actions to enable this step."
            exit 0
          fi
          cp .env.example .env
          npm run db:migrate
